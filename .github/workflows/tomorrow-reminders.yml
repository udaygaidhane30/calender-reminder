name: Tomorrow's Reminders

on:
  schedule:
    # Runs at 3:30 PM UTC (9:00 PM IST) every day
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # Needed to commit refreshed token back to repo

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config directory
        run: mkdir -p config

      - name: Setup Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          # Save OAuth credentials
          echo "$GOOGLE_CREDENTIALS" > config/credentials.json

          # Decrypt the token
          if [ -f "config/token.encrypted" ]; then
            python scripts/token_manager.py decrypt config/token.encrypted config/token.json "$TOKEN_ENCRYPTION_KEY"
            echo "✓ Token decrypted successfully"
          else
            echo "⚠ Warning: No encrypted token found. First-time setup required."
            echo "   See ENCRYPTED_TOKEN_SETUP.md for instructions"
          fi

      - name: Create logs directory
        run: mkdir -p logs

      - name: Check and send tomorrow's reminders
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          DEFAULT_RECIPIENT_NUMBER: ${{ secrets.DEFAULT_RECIPIENT_NUMBER }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          python main.py --check tomorrow

      - name: Check if token was refreshed
        id: check_token
        run: |
          # Compare token modification time
          if [ -f "config/token.json" ]; then
            # Check if token is newer than start of workflow (was refreshed)
            if [ "$(find config/token.json -mmin -5)" ]; then
              echo "token_refreshed=true" >> $GITHUB_OUTPUT
              echo "✓ Token was refreshed during this run"
            else
              echo "token_refreshed=false" >> $GITHUB_OUTPUT
              echo "✓ Token is still valid, no refresh needed"
            fi
          fi

      - name: Re-encrypt and commit refreshed token
        if: steps.check_token.outputs.token_refreshed == 'true'
        env:
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          # Re-encrypt the refreshed token
          python scripts/token_manager.py encrypt config/token.json config/token.encrypted "$TOKEN_ENCRYPTION_KEY"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push
          git add config/token.encrypted
          git commit -m "chore: auto-update refreshed Google OAuth token [skip ci]"
          git push

          echo "✓ Refreshed token encrypted and committed to repository"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomorrow-reminder-logs
          path: logs/reminder_app.log
          retention-days: 7
